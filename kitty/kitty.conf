# Pin shell explicitly — kitty's "shell ." default uses whatever SHELL was in
# kitty's own environment at launch, which goes stale after chsh until the
# next full login.
shell /usr/bin/zsh

font_family CaskaydiaCove Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10.0
enable_audio_bell no
cursor_trail 1
window_padding_width 10

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no

include colors.conf
